# RC3.4 PATCH2.7-A - Video Generation Request Contract
# Single source of truth for the Runtime Adapter boundary.
# DESIGN ONLY: no GPU / ComfyUI / Native runtime call.

video_generation_request:
  study_id:
    type: string
    example: "facade_motion_study"
    required: true

  reference_assets:
    type: list
    required: true
    min_items: 1
    items:
      asset_id:
        type: string
      role:
        type: enum
        allowed:
          - "first_frame"
          - "last_frame"
          - "identity_reference"
          - "style_reference"
          - "material_reference"
          - "site_reference"
          - "motion_reference_video"
          - "camera_reference_video"
          - "audio_reference"
          - "timeline_guide"
          - "context"  # legacy metadata only; not an A4.1 execution role
      path_or_ref:
        type: string
      sha256:
        type: string
        nullable: true
      project_id:
        type: string
      approval_state:
        type: enum
        allowed: ["PENDING", "APPROVED", "REJECTED"]

  guide_frames:
    type: list
    required: false
    default: []
    execution: "metadata_only; MiniMaxH3AddGuide is not invoked in A4.1"
    items:
      asset_id:
        type: string
        required: true
      role:
        type: enum
        allowed:
          - "first_frame"
          - "last_frame"
          - "identity_reference"
          - "style_reference"
          - "material_reference"
          - "site_reference"
          - "motion_reference_video"
          - "camera_reference_video"
          - "audio_reference"
          - "timeline_guide"
      time_seconds:
        type: number
        minimum: 0
      frame_index:
        type: integer
        minimum: 0
      approval_state:
        type: enum
        allowed: ["PENDING", "APPROVED", "REJECTED"]

  workflow_id:
    type: enum
    allowed:
      - "01_Exterior_Hero"
      - "02_Day_Night_Transition"
      - "03_Material_Detail"
      - "04_Drone_Aerial"
      - "05_Slow_Walkthrough"
    required: true

  camera_motion:
    type: enum
    allowed:
      - static
      - slow_push
      - slow_pull
      - slow_pan
      - slow_arc
      - walkthrough
      - aerial_reveal
    required: true

  generation_parameters:
    type: object
    required: true
    fields:
      resolution:
        type: string
        allowed: ["672x384", "832x480", "1024x576", "1248x704", "1344x768", "1920x1080"]
        default: "1344x768"
      fps:
        type: integer
        allowed: [24]
        default: 24
        semantics: "legacy alias for native_generation_fps; never the delivery rate"
      native_generation_fps:
        type: integer
        allowed: [24]
        default: 24
        derived: true
      duration:
        type: number
        minimum: 4.0
        maximum: 15.0
        default: 4.0
        semantics: "requested duration seconds; resolved upward to H3 17k+5 frames at 24 FPS"
      frame_count:
        type: integer
        derived: true
        allowed_grid: "17k+5"
      resolved_duration_seconds:
        type: number
        derived: true
      quality:
        type: enum
        allowed: ["DRAFT", "PREVIEW", "BALANCED", "STANDARD", "NATIVE_HIGH", "ULTRA_1080", "ULTRA_2K"]
        default: "NATIVE_HIGH"
      delivery_fps:
        type: integer
        allowed: [24, 30, 48, 60]
        default: 24
      quality_execution_mode:
        type: enum
        allowed: ["NATIVE_H3", "H3_REGENERATE_2K", "POST_UPSCALE_2K", "POST_UPSCALE"]
        nullable: true
      aspect_ratio:
        type: enum
        allowed: ["auto", "16:9", "9:16", "1:1"]
        default: "auto"
      generation_speed:
        type: enum
        allowed: ["standard", "auto"]
        default: "standard"
      sampler_mode:
        type: enum
        allowed: ["euler", "res_multistep"]
        default: "euler"
      sigma_points:
        type: integer
        minimum: 2
        maximum: 100
        default: 50
      accel:
        type: enum
        allowed: ["off", "auto", "manual-velocity", "manual-cache-dit"]
        default: "off"
      velocity_cache:
        type: boolean
        default: false
      cache_dit:
        type: boolean
        default: false
      seed:
        type: integer
        required: true

  prompt_payload:
    type: object
    required: true
    fields:
      mode:
        type: enum
        allowed: ["I2VA", "FL2VA"]
      prompt:
        type: string
      alignment:
        type: string
      integrated_multimodal_description:
        type: string
      overall_soundscape:
        type: string
      non_diegetic_music:
        type: string
        default: "N/A"
      prompt_hash:
        type: string
      provenance_ref:
        type: string
        nullable: true

  output_spec:
    type: object
    required: true
    fields:
      container:
        type: string
        default: "mp4"
      codec:
        type: string
        default: "h264"
      fps:
        type: integer
        default: 24
      resolution:
        type: string
        default: "1344x768"
      native_generation:
        type: object
        required: true
        fields:
          width:
            type: integer
          height:
            type: integer
          fps:
            type: integer
            allowed: [24]
          frame_count:
            type: integer
            derived: true
            allowed_grid: "17k+5"
          duration_seconds:
            type: number
            derived: true
          requested_duration_seconds:
            type: number
      delivery:
        type: object
        required: true
        fields:
          width:
            type: integer
          height:
            type: integer
          fps:
            type: integer
            allowed: [24, 30, 48, 60]
          upscale_method:
            type: string
            nullable: true
          interpolation_method:
            type: string
            nullable: true
          postprocess_applied:
            type: boolean
      preview_frames:
        type: list
        default: ["first", "0.25", "0.5", "0.75", "last"]
      report_format:
        type: string
        default: "json"

  gates:
    type: object
    required: true
    fields:
      reference_approved:
        type: boolean
        required: true
      intent_confirmed:
        type: boolean
        required: true
      prompt_verified:
        type: boolean
        required: true
      risk_reviewed:
        type: boolean
        required: true

runtime_status:
  allowed:
    - QUEUED
    - PREPARING
    - LOADING_MODEL
    - SAMPLING
    - ENCODING
    - EXPORTING
    - COMPLETED
    - FAILED
    - CANCELLED
  terminal:
    - COMPLETED
    - FAILED
    - CANCELLED

# Runtime Status -> Existing Job Status (mapping ONLY; state machine unchanged)
state_mapping:
  QUEUED: PREPARING
  PREPARING: PREPARING
  LOADING_MODEL: LOADING_MODEL
  SAMPLING: SAMPLING
  ENCODING: ENCODING
  EXPORTING: EXPORTING
  COMPLETED: COMPLETED
  FAILED: GPU_FAILED
  CANCELLED: GPU_FAILED   # existing machine has no CANCELLED; terminal, no auto retry
