<!doctype html>
<html lang="zh-CN" data-ux2="on" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <title>Architect Video Studio — Home</title>
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="vendor/shoelace/dark.css">
  <script type="module" src="vendor/shoelace/shoelace.js"></script>
  <script src="js/shoelace_bridge.js"></script>
  <script src="js/ux2_shell.js"></script>
</head>
<body class="app-shell app-home">
  <header class="topbar app-header">
    <span class="brand">Architect<span class="dot">·</span>Video&nbsp;Studio</span>
    <nav class="nav app-nav" aria-label="主导航">
      <a data-route="home" href="index.html"><img class="avs-icon" src="vendor/tabler/home.svg" alt="" aria-hidden="true">Home</a>
      <a data-route="study" data-nav-study href="index.html?new=1"><img class="avs-icon" src="vendor/tabler/photo.svg" alt="" aria-hidden="true">Study</a>
      <a data-route="jobs" href="jobs.html"><img class="avs-icon" src="vendor/tabler/briefcase.svg" alt="" aria-hidden="true">Jobs</a>
      <a data-route="outputs" href="output.html"><img class="avs-icon" src="vendor/tabler/file-description.svg" alt="" aria-hidden="true">Outputs</a>
      <a data-route="environment" href="setup.html"><img class="avs-icon" src="vendor/tabler/settings.svg" alt="" aria-hidden="true">Environment</a>
    </nav>
    <span class="spacer"></span>
    <span class="small muted">Architectural workstation</span>
  </header>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <main id="main-content" class="wrap app-main">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
      <h2 style="margin:0;">Recent Studies</h2>
      <span class="muted small">建筑师 AI 视频生成工作站</span>
      <span class="spacer" style="flex:1;"></span>
      <sl-button class="btn primary" id="new-video-btn">+ New Study</sl-button>
    </div>

    <div id="new-task-box" class="panel mb" style="display:none;">
      <h3>New Study</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
        <div style="flex:2;min-width:220px;">
          <label>Study 标题</label>
          <input type="text" id="task-title" placeholder="例如：入口缓慢推进（杭州办公园区）">
        </div>
        <div style="flex:1;min-width:150px;">
          <label>类型标签（辅助）</label>
          <sl-select id="task-project-type">
            <sl-option value="exterior">exterior</sl-option>
            <sl-option value="interior">interior</sl-option>
            <sl-option value="material">material</sl-option>
            <sl-option value="lighting">lighting</sl-option>
            <sl-option value="aerial">aerial</sl-option>
            <sl-option value="landscape">landscape</sl-option>
            <sl-option value="mixed">mixed</sl-option>
          </sl-select>
        </div>
        <div style="flex:1;min-width:130px;">
          <label>阶段</label>
          <sl-select id="task-stage">
            <sl-option>方案</sl-option><sl-option>扩初</sl-option><sl-option>报建</sl-option><sl-option>展示</sl-option>
          </sl-select>
        </div>
        <sl-button class="btn" id="task-cancel-btn">取消</sl-button>
        <sl-button class="btn primary" id="task-create-btn">创建 Study</sl-button>
      </div>
    </div>

    <div id="tasks" class="task-grid"></div>
    <div id="err" class="error-banner" style="display:none;"></div>
    <div class="panel mt" style="display:flex;justify-content:space-between;align-items:center;">
      <span id="sys-status" class="small muted">System: …</span>
      <a href="setup.html">⚙ System / Environment</a>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/engine_status.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
