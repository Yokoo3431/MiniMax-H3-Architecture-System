<!doctype html>
<html lang="zh-CN" data-ux2="on" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architect Video Studio — Job Center</title>
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="vendor/shoelace/dark.css">
  <link rel="stylesheet" href="css/avs_global_theme.css">
  <script type="module" src="vendor/shoelace/shoelace.js"></script>
  <script src="js/shoelace_bridge.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ux2_shell.js"></script>
</head>
<body class="app-shell app-jobs">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar app-header">
    <span class="brand">Architect<span class="dot">·</span>Video&nbsp;Studio</span>
    <nav class="nav app-nav" aria-label="主导航">
      <a data-route="home" href="index.html"><img class="avs-icon" src="vendor/tabler/home.svg" alt="" aria-hidden="true">首页</a>
      <a data-route="study" data-nav-study href="index.html?new=1"><img class="avs-icon" src="vendor/tabler/photo.svg" alt="" aria-hidden="true">Study</a>
      <a data-route="jobs" href="jobs.html"><img class="avs-icon" src="vendor/tabler/briefcase.svg" alt="" aria-hidden="true">任务</a>
      <a data-route="outputs" href="output.html"><img class="avs-icon" src="vendor/tabler/file-description.svg" alt="" aria-hidden="true">输出</a>
      <a data-route="environment" href="setup.html"><img class="avs-icon" src="vendor/tabler/settings.svg" alt="" aria-hidden="true">环境</a>
    </nav>
    <span class="spacer"></span>
    <span class="small muted">生产任务</span>
  </header>
  <main id="main-content" tabindex="-1" class="wrap app-main">
    <h2 style="margin-top:0;">任务中心</h2>
    <div class="panel">
      <div class="project-selection-row" style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
        <label id="project-select-label" style="margin:0;">项目</label>
        <sl-select id="project-select" aria-labelledby="project-select-label" placeholder="全部项目"></sl-select>
        <sl-button class="btn" id="refresh-btn">刷新</sl-button>
      </div>
      <div class="jobs-search-toolbar" role="search" aria-label="跨项目任务筛选">
        <label for="job-search">搜索 Job ID / 工作流 / 项目
          <input id="job-search" type="search" maxlength="160" placeholder="输入历史 Job ID 或关键词" autocomplete="off">
        </label>
        <label for="job-state-filter">状态
          <select id="job-state-filter">
            <option value="">全部状态</option><option value="COMPLETED">已完成</option><option value="ACTIVE">进行中</option>
            <option value="FAILED">失败</option><option value="GPU_FAILED">GPU 失败</option>
            <option value="CANCELLED">已取消</option><option value="SUBMISSION_LOST">待核验</option>
            <option value="RECONCILING">整理中</option>
          </select>
        </label>
        <label for="job-runtime-filter">运行环境
          <select id="job-runtime-filter">
            <option value="">全部环境</option><option value="production">生产</option>
            <option value="experimental">实验</option><option value="mock">模拟</option>
            <option value="unknown">未记录</option>
          </select>
        </label>
        <label for="job-created-from">创建日期（起）<input id="job-created-from" type="date"></label>
        <label for="job-created-to">创建日期（止）<input id="job-created-to" type="date"></label>
        <sl-button class="btn primary" id="job-search-btn">搜索全部任务</sl-button>
      </div>
      <div id="selection-hint" class="selection-hint" role="status" aria-live="polite"></div>
      <table class="table jobs-table">
        <thead><tr><th>项目 / Study</th><th>Job</th><th>Workflow</th><th>状态</th><th>Seed</th><th>创建时间</th><th>输出</th></tr></thead>
        <tbody id="jobs-body"></tbody>
      </table>
      <div class="jobs-pagination">
        <span id="job-result-count" class="small muted" role="status" aria-live="polite"></span>
        <div class="row" style="gap:8px;">
          <sl-button class="btn" id="jobs-prev" disabled>上一页</sl-button>
          <sl-button class="btn" id="jobs-next" disabled>下一页</sl-button>
        </div>
      </div>
      <div id="err" class="error-banner" role="alert" aria-live="assertive" aria-atomic="true" style="display:none;"></div>
    </div>
    <div class="panel job-detail-panel" id="job-detail" style="display:none;margin-top:14px;">
      <div class="job-detail-head">
        <div><h3 id="detail-title" style="margin:0 0 4px;">任务详情</h3><div id="detail-subtitle" class="muted small"></div></div>
        <div id="detail-status"></div>
      </div>
      <div class="job-detail-grid">
        <div id="detail-reference"></div>
        <div>
          <div id="detail-summary"></div>
          <div class="job-actions mt" id="detail-actions"></div>
          <sl-details class="mt" summary="技术详情"><pre class="prompt" id="detail-technical"></pre></sl-details>
        </div>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/engine_status.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
