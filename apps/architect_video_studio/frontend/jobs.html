<!doctype html>
<html lang="zh-CN" data-ux2="on" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <title>Architect Video Studio — Job Center</title>
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="vendor/shoelace/dark.css">
  <script type="module" src="vendor/shoelace/shoelace.js"></script>
  <script src="js/shoelace_bridge.js"></script>
  <script src="js/ux2_shell.js"></script>
</head>
<body class="app-shell app-jobs">
  <header class="topbar app-header">
    <span class="brand">Architect<span class="dot">·</span>Video&nbsp;Studio</span>
    <nav class="nav app-nav" aria-label="主导航">
      <a data-route="home" href="index.html"><img class="avs-icon" src="vendor/tabler/home.svg" alt="" aria-hidden="true">Home</a>
      <a data-route="study" data-nav-study href="index.html?new=1"><img class="avs-icon" src="vendor/tabler/photo.svg" alt="" aria-hidden="true">Study</a>
      <a data-route="jobs" href="jobs.html"><img class="avs-icon" src="vendor/tabler/briefcase.svg" alt="" aria-hidden="true">Jobs</a>
      <a data-route="outputs" href="output.html"><img class="avs-icon" src="vendor/tabler/file-description.svg" alt="" aria-hidden="true">Outputs</a>
      <a data-route="environment" href="setup.html"><img class="avs-icon" src="vendor/tabler/settings.svg" alt="" aria-hidden="true">Environment</a>
    </nav>
    <span class="spacer"></span>
    <span class="small muted">Production jobs</span>
  </header>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <main id="main-content" class="wrap app-main">
    <h2 style="margin-top:0;">Job Center</h2>
    <div class="panel">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
        <label style="margin:0;">项目</label>
        <sl-select id="project-select" style="width:320px;"></sl-select>
        <sl-button class="btn" id="refresh-btn">刷新</sl-button>
      </div>
      <table class="table jobs-table">
        <thead><tr><th>Job</th><th>Workflow</th><th>状态</th><th>Seed</th><th>创建时间</th><th></th></tr></thead>
        <tbody id="jobs-body"></tbody>
      </table>
      <div id="err" class="error-banner" style="display:none;"></div>
    </div>
    <div class="panel job-detail-panel" id="job-detail" style="display:none;margin-top:14px;">
      <div class="job-detail-head">
        <div><h3 id="detail-title" style="margin:0 0 4px;">任务详情</h3><div id="detail-subtitle" class="muted small"></div></div>
        <div id="detail-status"></div>
      </div>
      <div class="job-detail-grid">
        <div id="detail-reference"></div>
        <div>
          <div id="detail-summary"></div>
          <div class="job-actions mt" id="detail-actions"></div>
          <sl-details class="mt" summary="技术详情"><pre class="prompt" id="detail-technical"></pre></sl-details>
        </div>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/engine_status.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
