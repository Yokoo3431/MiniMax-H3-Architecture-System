<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Architect Video Studio — Job Center</title>
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">Architect<span class="dot">·</span>Video&nbsp;Studio</span>
    <a href="index.html">Home</a>
    <span class="crumb">Job Center</span>
    <span class="spacer"></span>
    <span class="small muted">Production jobs</span>
  </div>
  <div class="wrap">
    <h2 style="margin-top:0;">Job Center</h2>
    <div class="panel">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;">
        <label style="margin:0;">项目</label>
        <select id="project-select" style="width:320px;"></select>
        <button class="btn" id="refresh-btn">刷新</button>
      </div>
      <table class="table">
        <thead><tr><th>Job</th><th>Workflow</th><th>状态</th><th>Seed</th><th>创建时间</th><th></th></tr></thead>
        <tbody id="jobs-body"></tbody>
      </table>
      <div id="err" class="error-banner" style="display:none;"></div>
    </div>
    <div class="panel job-detail-panel" id="job-detail" style="display:none;margin-top:14px;">
      <div class="job-detail-head">
        <div><h3 id="detail-title" style="margin:0 0 4px;">任务详情</h3><div id="detail-subtitle" class="muted small"></div></div>
        <div id="detail-status"></div>
      </div>
      <div class="job-detail-grid">
        <div id="detail-reference"></div>
        <div>
          <div id="detail-summary"></div>
          <div class="job-actions mt" id="detail-actions"></div>
          <details class="mt"><summary>技术详情</summary><pre class="prompt" id="detail-technical"></pre></details>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/engine_status.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
