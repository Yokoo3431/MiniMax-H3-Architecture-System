<!doctype html>
<html lang="zh-CN" data-ux2="on" class="sl-theme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architect Video Studio — Output Review</title>
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="vendor/shoelace/dark.css">
  <link rel="stylesheet" href="css/avs_global_theme.css">
  <script type="module" src="vendor/shoelace/shoelace.js"></script>
  <script src="js/shoelace_bridge.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ux2_shell.js"></script>
</head>
<body class="app-shell app-output">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar app-header">
    <span class="brand">Architect<span class="dot">·</span>Video&nbsp;Studio</span>
    <nav class="nav app-nav" aria-label="主导航">
      <a data-route="home" href="index.html"><img class="avs-icon" src="vendor/tabler/home.svg" alt="" aria-hidden="true">首页</a>
      <a data-route="study" data-nav-study href="index.html?new=1"><img class="avs-icon" src="vendor/tabler/photo.svg" alt="" aria-hidden="true">Study</a>
      <a data-route="jobs" href="jobs.html"><img class="avs-icon" src="vendor/tabler/briefcase.svg" alt="" aria-hidden="true">任务</a>
      <a data-route="outputs" href="output.html"><img class="avs-icon" src="vendor/tabler/file-description.svg" alt="" aria-hidden="true">输出</a>
      <a data-route="environment" href="setup.html"><img class="avs-icon" src="vendor/tabler/settings.svg" alt="" aria-hidden="true">环境</a>
    </nav>
    <span class="spacer"></span>
    <span class="small muted">结果审阅</span>
    <span id="job-id" class="small">…</span>
  </header>
  <main id="main-content" tabindex="-1" class="wrap app-main">
    <h2 style="margin-top:0;">输出审阅</h2>
    <div id="err" class="error-banner" role="alert" aria-live="assertive" aria-atomic="true" style="display:none;"></div>
    <div id="output-context-actions" class="row mt" style="display:none;gap:8px;" aria-label="输出上下文导航"></div>
    <div class="workspace" style="grid-template-columns:1fr 1fr;">
      <div class="panel">
        <h3>视频</h3>
        <div class="video-box"><video id="output-video" controls preload="metadata" hidden></video><span id="output-video-empty" class="small">完成的输出会显示在这里。</span></div>
        <div class="row mt" style="gap:8px;"><a id="output-download" class="btn small primary" hidden>下载原生视频</a></div>
        <div id="params" class="mt"></div>
      </div>
      <div class="panel">
        <h3>生成摘要</h3>
        <details id="output-technical-details" class="mt">
          <summary>生成记录与技术详情（可选）</summary>
          <div id="record" class="small mt"></div>
          <h4>输出文件组织</h4>
          <div class="pkg-tree" id="pkg-tree"></div>
        </details>
      </div>
    </div>
    <section class="panel mt" aria-labelledby="delivery-heading">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;">
        <div>
          <h3 id="delivery-heading" style="margin-top:0;">交付副本 · 后处理</h3>
          <p class="small muted">原生 H3 成片保持不变。交付版本单独生成并记录缩放、插帧与探测结果；不会重新运行生成。</p>
        </div>
        <form id="delivery-form" class="row" style="gap:8px;align-items:end;flex-wrap:wrap;" hidden>
          <label class="small">交付画布
            <select id="delivery-resolution" name="target_resolution">
              <option value="NATIVE">保持原生画布</option>
              <option value="ULTRA_1080">1080p · 1920×1080</option>
              <option value="ULTRA_2K">2K · 2048×1152</option>
            </select>
          </label>
          <label class="small">交付帧率
            <select id="delivery-fps" name="delivery_fps">
              <option value="24">24 fps</option>
              <option value="48">48 fps</option>
              <option value="60">60 fps</option>
            </select>
          </label>
          <button id="delivery-submit" class="btn primary" type="submit">生成交付副本</button>
        </form>
      </div>
      <p id="delivery-status" class="small muted" role="status" aria-live="polite">请先从 Jobs 打开一个已完成任务，之后可在此创建交付副本。</p>
      <div class="workspace delivery-workspace">
        <div>
          <h4>交付预览</h4>
          <div class="video-box"><video id="delivery-video" controls preload="metadata" hidden></video><span id="delivery-video-empty" class="small">选择已验证的交付版本后可在此预览。</span></div>
          <div id="delivery-preview-meta" class="small muted mt"></div>
        </div>
        <div>
          <h4>交付记录</h4>
          <div id="delivery-list" class="small" aria-live="polite">从 Jobs 打开已完成任务后，这里会显示交付记录。</div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/engine_status.js"></script>
  <script src="js/output.js"></script>
</body>
</html>
