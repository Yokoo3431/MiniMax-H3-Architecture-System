# ComfyUI Extra Model Paths Configuration for MiniMax H3 Architecture Infrastructure System
# Multi-PC / Multi-Drive / NAS Model Mapping Rules

# PC_Primary (Default Local RTX 5070 Setup)
comfyui_primary:
  base_path: D:/ProgramFilesNormal/ComfyUI/ComfyUI_windows_portable/ComfyUI
  is_default: true
  checkpoints: models/checkpoints
  diffusion_models: models/diffusion_models
  text_encoders: models/text_encoders
  vae: models/vae

# PC_Secondary_Drive (Alternative E: Drive Setup)
comfyui_e_drive:
  base_path: E:/ComfyUI/models
  is_default: false
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  vae: vae

# PC_NAS_Share (Network Storage Setup)
comfyui_nas_storage:
  base_path: //NAS_SERVER/AiModels/MiniMax-H3
  is_default: false
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  vae: vae
